apiVersion: v1
kind: ServiceAccount
metadata:
  name: osrm-refresher
  namespace: bumpinto
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: osrm-refresher
  namespace: bumpinto
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["osrm-car", "osrm-bicycle", "osrm-foot"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: osrm-refresher
  namespace: bumpinto
subjects:
  - kind: ServiceAccount
    name: osrm-refresher
    namespace: bumpinto
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: osrm-refresher
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: osrm-refresh
  namespace: bumpinto
spec:
  # Ayin 2'si 04:00 — venues-open-import'tan (1'i 03:00) bir gun sonra, cakismasin
  schedule: "0 4 2 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 10800
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: osrm-refresher
          initContainers:
            - name: fetch-pbf
              image: curlimages/curl:8.11.1
              command: ["sh", "-c"]
              args:
                - curl -sSfL -o /data/netherlands-latest.osm.pbf "$PBF_URL"
              env:
                - name: PBF_URL
                  value: https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
              volumeMounts:
                - { name: data, mountPath: /data }
            - name: prepare
              image: osrm/osrm-backend:v5.27.1
              command: ["/bin/bash", "/scripts/prepare.sh"]
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: scripts, mountPath: /scripts }
              resources:
                requests: { cpu: "2", memory: 4Gi }
                limits: { memory: 12Gi }
          containers:
            - name: restart
              image: bitnami/kubectl:1.31
              command: ["kubectl"]
              args:
                - -n
                - bumpinto
                - rollout
                - restart
                - deployment/osrm-car
                - deployment/osrm-bicycle
                - deployment/osrm-foot
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: osrm-data }
            - name: scripts
              configMap:
                name: osrm-prepare
                defaultMode: 0755
