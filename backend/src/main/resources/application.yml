spring:
  application:
    name: bumpinto-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bumpinto}
    username: ${DB_USER:bumpinto}
    password: ${DB_PASSWORD:bumpinto}

server:
  port: 8060

bumpinto:
  security:
    # Default YOK (bilincli): preprod/prod'da bu degerler yoksa acilis patlar.
    # Local default'lari application-local.yml'de.
    google-client-id: ${GOOGLE_CLIENT_ID}
    token-secret: ${TOKEN_SECRET}
    # 12h -> 15m (B-16): erisim jetonu artik KISA omurlu, yaninda yenileme jetonu var.
    # Calinan bir erisim jetonunun penceresi 12 saatten 15 dakikaya iner.
    token-ttl: 15m
    # Yenileme jetonu kayan pencere: her rotasyon sureyi bastan baslatir.
    refresh-ttl: 30d
  apple:
    # Bos birakilabilir: Apple girisi kapali (503), uygulama acilir. Prod'da ZORUNLU (4.8).
    services-id: ${APPLE_SERVICES_ID:}
    bundle-id: ${APPLE_BUNDLE_ID:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
  rate-limit:
    # Default GUVENLI (false): X-Forwarded-For istemci tarafindan uydurulabilir.
    # YALNIZCA header'i ezerek yeniden yazan bir ingress arkasinda true yapilir (Plan 5).
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  voice:
    # Ses odasinin sert omru (spec K7); TURN kimligi kalan sure kadar uretilir.
    max-duration: ${VOICE_MAX_DURATION:PT2H}
  turn:
    # Bos birakilabilir: TURN yok, yalniz STUN (K11). Cloudflare Realtime > TURN keys.
    key-id: ${CLOUDFLARE_TURN_KEY_ID:}
    api-token: ${CLOUDFLARE_TURN_API_TOKEN:}
  venues:
    sources:
      # key/budget bos birakilamayan tek kaynak foursquare (requiresKey=true, enabled=true).
      # tier: premium = foto/puan/saat, $18,75/1k, ucretsiz payi yok | pro = temel alanlar, ayda 500 ucretsiz.
      foursquare: { enabled: true,  key: "${FOURSQUARE_API_KEY}", budget: "${FSQ_PREMIUM_MONTHLY_BUDGET:5000}", tier: "${FSQ_TIER:premium}" }
      open:        { enabled: true,  key: "", budget: 0 }   # 0 = sinirsiz (yerel PostGIS)
      google:      { enabled: false, key: "${GOOGLE_PLACES_API_KEY:}", budget: 1000 }
    route:
      # Ucretli kaynak YALNIZ dort tabela turunde; kalan 11 tur acik tabandan.
      COFFEE: foursquare,open
      FOOD: foursquare,open
      BAR: foursquare,open
      NIGHTLIFE: foursquare,open
      MUSEUM: open
      THEME_PARK: open
      ART: open
      WALK: open
      HIKE: open
      SWIM: open
      FITNESS: open
      CINEMA: open
      GAMES: open
      ADVENTURE: open
      ACTIVITY: open
  map:
    engine: ${MAP_ENGINE:maplibre}   # maplibre | google
    tiles:
      style-url: ${MAP_TILES_STYLE_URL:https://tiles.openfreemap.org/styles/bright}
  geocode:
    # Nominatim politikasi: User-Agent'ta gercek bir iletisim adresi ZORUNLU.
    contact: ${NOMINATIM_CONTACT:dev@bumpinto.test}
    min-interval: ${NOMINATIM_MIN_INTERVAL:PT1S}
    base-url: ${GEOCODE_BASE_URL:https://nominatim.openstreetmap.org}
  routing:
    osrm:
      # Bos = OSRM yok; TravelMinutes haversine tahminine duser (estimated=true).
      car: "${OSRM_CAR_URL:}"
      bicycle: "${OSRM_BICYCLE_URL:}"
      foot: "${OSRM_FOOT_URL:}"
  og:
    # Onizleme karti: hem HTTP max-age hem surec ici Caffeine TTL'i (R-B10 kabul a).
    cache: ${OG_CACHE:PT24S}
    # Davet linkinin yasadigi kaynak (/j/{slug}) ve bu API'nin dis adresi (PNG mutlak URL'i).
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    public-base-url: ${PUBLIC_API_BASE_URL:http://localhost:8060}
  retention:
    enabled: ${RETENTION_ENABLED:true}
    # Spec §6 GDPR: suresi dolali 30 gunu gecen oturumlarin kalici silinmesi (B-3).
    # Spring cron: saniye dakika saat gun ay haftagunu -- her gece 03:30 UTC.
    # Anahtari SessionPurgeJob'daki @Scheduled dogrudan okur (AppProps'a girmez).
    session-purge-cron: ${SESSION_PURGE_CRON:0 30 3 * * *}
