info:
  name: Find Venues
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/sessions/{{slug}}/find-venues"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.venues && res.body.venues.length > 0) {
          bru.setVar("venueId", res.body.venues[0].id);
        }
    - type: tests
      code: |-
        test("200 doner", function() {
          expect(res.status).to.equal(200);
        });
        test("durum SWIPING", function() {
          expect(res.body.status).to.equal("SWIPING");
        });

docs:
  type: text/markdown
  content: |-
    Host JWT gerekir. Merkezi belirler, mekan saglayicisindan desteyi kurar
    ve oturumu SWIPING'e gecirir. Sonuc bulunamazsa yaricap genisletilir
    (en fazla `SearchRadius.MAX_EXPANSIONS`); hic mekan yoksa 422 doner.

    **Capasiz oturumda** merkez konumlu katilimcilarin agirlikli orta noktasi, yaricap
    yayilimdan gelir ve EN AZ 2 KONUMLU KATILIMCI sarttir (aksi halde 409).
    **Capali oturumda** (`POST /api/sessions` ile `anchor` verilmisse) merkez capanin
    kendisidir, yaricap 2 km'ye sabittir ve bu onkosul DUSER — hic konumlu katilimci
    olmadan da deste kurulur.

    `422 NoVenuesFound` yalniz HICBIR aktiviteden mekan gelmediginde doner. Kismi sonuc
    (secilen 3 alandan 1'i bos) BASARIDIR; eksik alan `emptyActivityTypes`'ta bildirilir.

    Yalnizca KONUMU OLAN katilimcilar deste akisina girer.

    Rate limit: 3/dk — bu ucta en dar limit, saglayici kotasini korur.

    Merkezin kasaba kelimesi CAPASIZ oturumda burada BIR KEZ cozulur (Nominatim, `zoom=10`,
    yuvarlanmis koordinattan) ve `sessions.midpoint_label`'a yazilir; `GET /api/sessions/{slug}`
    bunu `midpointLabel` olarak doner. Cozulemezse null — akis etkilenmez.
    Capali oturumda alan ZATEN dolu (host'un `anchor.label`'i olusturmada yazildi): burada
    ne ezilir ne de ikinci bir ters-geocode istegi atilir.
    Atif: bu alani gosteren her ekranda "© OpenStreetMap contributors".

    Yanit govdesi `get-session.yml` ile AYNI `SessionView` semasidir (ayni `SessionViewAssembler`) —
    `venues[]` burada ilk kez `travelMinutes`, `fairness{maxMinutes,spreadMinutes,longestParticipantId}`,
    `provider`, `category`, `address`, `locality`, `ratingCount`, `hoursToday`, `placeLink` dolu
    olarak doner (alan detaylari icin `get-session.yml` docs). `deckOrder` burada ilk kez
    yazilir: capasiz oturumda adalet siralamasiyla, capali oturumda puan siralamasiyla.
