info:
  name: Create Session
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/sessions"
  headers:
    - name: content-type
      value: application/json
    - name: X-Client
      value: mobile
  body:
    type: json
    data: |-
      {
        "activityTypes": ["COFFEE", "HIKE"],
        "name": "Cuma kahvesi",
        "sessionType": "GROUP",
        "lat": 51.6978,
        "lng": 5.3037,
        "displayName": "Mehmet",
        "locationLabel": "'s-Hertogenbosch",
        "travelMode": "CAR"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("slug", res.body.slug);
          bru.setVar("sessionId", res.body.sessionId);
          bru.setVar("hostParticipantId", res.body.participantId);
          if (res.body.participantToken) {
            bru.setVar("hostParticipantToken", res.body.participantToken);
            bru.setVar("participantToken", res.body.participantToken);
          }
        }
    - type: tests
      code: |-
        test("201 doner", function() {
          expect(res.status).to.equal(201);
        });
        test("slug uretildi", function() {
          expect(res.body.slug).to.be.a("string");
        });

docs:
  type: text/markdown
  content: |-
    Host JWT gerekir. Host ayni zamanda katilimci olarak eklenir.

    `activityTypes` 1-3 deger, TEKRARSIZ. Bos liste, 4+ eleman ya da tekrar 400 doner.
    Siralama host'un secim sirasidir; deste kovalari bu sirada doldurulur.

    Gecerli degerler (15, bilinmeyen deger 400 doner):
    - Foursquare + Google: `COFFEE` `FOOD` `BAR` `WALK` `ACTIVITY` (=bowling)
    - **Yalnizca Google** (kartlarda foto YOK, puan var): `SWIM` `HIKE` `FITNESS` `CINEMA`
      `MUSEUM` `ART` `NIGHTLIFE` `THEME_PARK` `ADVENTURE` `GAMES`

    `name` max 60, `displayName` max 40 (`Texts` ile normalize edilir).
    `lat` -90..90, `lng` -180..180 — disina cikan deger 400 doner.

    `lat`/`lng` ile `anchor` arasinda EN AZ BIRI zorunlu; ikisi de yoksa 400 doner.

    `anchor`: `{ "lat": 52.3676, "lng": 4.9041, "label": "Amsterdam" }` — host'un sabit
    bulusma noktasi. Verilirse merkez ORTA NOKTA DEGIL bu noktadir, arama yaricapi 2 km'ye
    sabitlenir (yeterli mekan cikmazsa arama x2 merdiveniyle gecici olarak genisler;
    `radiusKm` yine 2 doner), `find-venues`in "en az 2 konumlu katilimci" onkosulu DUSER ve
    `SessionView.anchored` `true` doner. `label` opsiyoneldir (max 80): verilirse istemcinin
    cozdugu addir, sunucu ikinci kez geocode etmez ve onu `midpointLabel` olarak olusturmada
    yazar. Verilmezse etiket `find-venues` sirasinda capa noktasindan ters-geocode edilir.

    Capali oturumda host kendi konumunu vermeyebilir (`lat`/`lng` atlanir); veren host icin
    yol suresi yine hesaplanir.

    `sessionType`: `GROUP` (varsayilan) | `SOLO`. SOLO'da davet linki calismaz, konumlar
    `points` ile eklenir.

    `travelMode`: `WALK|BIKE|EBIKE|TRANSIT|CAR`; alan yoksa `CAR`. Yol suresi bu moda gore
    hesaplanir.

    Rate limit: 10/dk.
