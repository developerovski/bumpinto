info:
  name: Get Session
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/sessions/{{slug}}"
  headers:
    - name: X-Participant-Token
      value: "{{participantToken}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.venues && res.body.venues.length > 0) {
          bru.setVar("venueId", res.body.venues[0].id);
        }
    - type: tests
      code: |-
        test("200 doner", function() {
          expect(res.status).to.equal(200);
        });

docs:
  type: text/markdown
  content: |-
    Katilimci token'i VEYA host JWT ile erisilir. Alanlar duruma gore doldurulur:
    deste yalnizca SWIPING'de, oy sayimi RUNOFF'ta, `decidedVenueId` DECIDED'da.

    Suresi dolmus oturum burada `EXPIRED` raporlanir — DB'ye yazilmaz, hesaplanan durumdur.

    `venues[].travelMinutes` **participantId** ile anahtarlidir (displayName degil —
    ayni isimli iki katilimci veri kaybina yol aciyordu).

    Bu istek destedeki ilk mekani `venueId` degiskenine yazar; Deck istekleri onu kullanir.

    Yeni alanlar: `sessionType`, `midpoint{lat,lng}` + `radiusKm` (konumlu >=2 nokta varsa),
    `participants[].approxLocation` (2 ondalik), `locationLabel`, `manual`,
    `participants[].travelMode` (`WALK|BIKE|EBIKE|TRANSIT|CAR`, varsayilan `CAR`),
    `runoffVotedParticipantIds` (yalniz RUNOFF'ta dolu; kimin kilitledigi, ne sectigi degil).
    Durum listesine `BROWSING` eklendi.

    Gizlilik: `midpoint` ve `radiusKm` de yuvarlanir (2 ondalik / 1 ondalik). Ham orta nokta
    2 kisilik oturumda kendi konumunu bilen tarafa digerinin tam koordinatini verirdi.

    `viewer{participantId, host}`: istegi yapanin oturumdaki satiri — katilimci token'i kendi
    satiri, host JWT host satiri; uye degilse null. Sayfa yenilemede 'ben kimim' bunu kullanir.

    `venues[].travelMinutes`: katilimci id -> ~dakika (5 dk basamagi, yuvarlanmis konumdan,
    kisinin `travelMode`'una gore). KONUMU OLAN HERKES icindir — istegi yapan dahil.
    `venues[].fairness`: `{ maxMinutes, spreadMinutes, longestParticipantId }` (spec §4.1).
    `participants[].midpointMinutes`: kisinin yuvarlanmis konumundan agirlikli ORTA NOKTAYA,
    kendi `travelMode`'uyla, 5 dk basamaginda; konumu yoksa ya da konumlu katilimci 2'den azsa null.
    Lobi/Bekle karti "herkes ~min–max dk" araligini bu alandan yazar.
    **Alan adlari W-6 ile sozlesme:** katilimci/oturum uclarinda `travelMode`
    (`POST /participants`, `PUT /location`, `POST /sessions`), profil ucunda `defaultTravelMode`
    (`GET`/`PUT /api/me`). Baska bir ad kullanilmaz.
    `venues[]` sirasi (`deckOrder`) ADALET onceliklidir: en uzun yol artan → fark artan →
    esitlerde oturum tohumlu sabit karisim. Herkes ayni sirayi gorur.

    `decisionKind`: `UNANIMOUS|SINGLE_LIKE|RUNOFF|FORCED|PARTIAL` (yalniz DECIDED'da dolu).
    `decidedAt`: karar ani (ISO-8601, yalniz DECIDED).
    `runoffReason`: `INTERSECTION|FALLBACK` — runoff'a neden dusuldugu; karar sonrasi da korunur.
    `likeCounts`: mekan -> begeni sayisi, YALNIZ DECIDED sonrasi dolu (oylama surerken gizli).
    `voteTally`: DECIDED'da ya da oy verecek HERKES oy verdiginde dolar; aksi halde bos —
    "kim kilitledi" bilgisi `runoffVotedParticipantIds`'ten, kendi secimin `viewer.runoffVoteVenueId`'den
    okunur. Baskasinin ne sectigi API'de HIC yoktur.

    `midpointLabel`: orta noktanin kasaba/semt kelimesi (null olabilir).

    `venues[].provider`: `google` | `foursquare` — kart altindaki atif satirini belirler
    ("Google Maps" / "Powered by Foursquare"; saglayici puanlari KARISTIRILMAZ).
    `venues[].category` / `address` / `locality` / `ratingCount` / `hoursToday` / `placeLink`:
    hepsi opsiyonel; null gelen alanin satiri UI'da HIC cizilmez. `locality` YALNIZ kasaba/semt
    kelimesidir (kart meta satiri); `address` tam kisa adrestir (Karar ekrani YER ekseni).
    Foursquare oturumlarinda `rating`, `priceLevel`, `photoUrl` ve `ratingCount` null'dur
    (Premium alanlar acilis maliyet modelinde istenmez).
    `mapsUrl` saglayici vermezse `https://www.google.com/maps/dir/?api=1&destination=lat,lng`
    olarak turetilir.
