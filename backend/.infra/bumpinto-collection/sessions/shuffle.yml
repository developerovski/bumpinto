info:
  name: Shuffle (Karıştır ve kaydır)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/sessions/{{slug}}/shuffle"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 doner", function() {
          expect(res.status).to.equal(200);
        });
        test("SWIPING'e gecer", function() {
          expect(res.body.status).to.equal("SWIPING");
        });

docs:
  type: text/markdown
  content: |-
    Host JWT gerekir. Yalniz `BROWSING` durumunda ve `sessionType=GROUP` icin (aksi 409).
    `deckOrder` adalet sirasina yeniden yazilir (idempotent); konum/ulasim modu degistiyse sira
    tazelenir. `deck_ready` olayi yayinlanir.
    Rate limit: ozel politika yok, genel `api` kovasina duser (120/dk).

    Yanit govdesi `get-session.yml` ile AYNI `SessionView` semasidir — `venues[]` alanlari
    (`fairness`, `travelMinutes`, `provider`, `category`, `address`, `locality`, `ratingCount`,
    `hoursToday`, `placeLink`) DEGISMEDEN korunur; yalniz siralama/`deckOrder` yeniden hesaplanir.

    Yeni 409: en az 2 "sunumda" (present) oy kullanacak katilimci yoksa `need at least 2
    participants present to start the deck` doner. Sunum = acik soket VAR ya da son 45 saniye
    icinde kopmus olmak. Host sikismaz: `BROWSING`'den `force-decision` hala kullanilabilir.
