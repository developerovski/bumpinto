info:
  name: Join Session
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/sessions/{{slug}}/participants"
  headers:
    - name: content-type
      value: application/json
    - name: X-Client
      value: mobile
  body:
    type: json
    data: |-
      {
        "displayName": "Ayse",
        "lat": 51.5719,
        "lng": 5.0672,
        "locationLabel": "Someren",
        "travelMode": "EBIKE"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body.participantToken) {
          bru.setVar("guestParticipantToken", res.body.participantToken);
          bru.setVar("guestParticipantId", res.body.participantId);
          bru.setVar("participantToken", res.body.participantToken);
        }
    - type: tests
      code: |-
        test("201 doner", function() {
          expect(res.status).to.equal(201);
        });
        test("mobil yolda katilimci token'i govdede gelir", function() {
          expect(res.body.participantToken).to.be.a("string");
        });

docs:
  type: text/markdown
  content: |-
    Public uc — davet linkiyle gelen herkes katilir, kimlik dogrulamasi yok.

    `lat`/`lng` OPSIYONEL: konumsuz katilim desteklenir, ama konumsuz katilimci
    deste akisinin DISINDA kalir (swipe/deck-done 409 doner, cozumu PUT /location).

    `X-Client: web` gonderilirse token govdede DONMEZ, `bumpinto_pt_{slug}` HttpOnly
    cookie'sine yazilir (`Path=/api/sessions/{slug}` — coklu oturum cakismaz).

    `travelMode` opsiyonel; verilmezse `CAR` (gec katilan da CAR — spec §4.5b).

    Rate limit: 10/dk.

    Yeni 409: `SWIPING`/`RUNOFF`/`DECIDED` durumunda YENI koltuk acilmaz (`session is closed
    for new participants: <STATUS>`). VAROLAN koltuk her durumda geri doner — bu uc ayni zamanda
    kimlik kurtarmadir (sekmesini yenileyen uyenin kendi koltuguna donmesi icin); koltuk
    kurtarmadan once kapatsaydi uyeler kendi oturumlarindan kilitlenirdi. Eskiden yalniz
    `DECIDED` reddediyordu, ustelik VAROLAN uyeyi bile reddediyordu.

    **409 `participants_too_far_apart`** — capasiz oturumda gonderilen konum, gruptaki mevcut
    konumlardan birine 100 km'den uzaksa reddedilir (`SpreadLimit.MAX_SPREAD_KM`). Orta nokta
    katilimci konumlarindan turedigi icin cok dagilmis bir grupta anlamsiz bir merkez
    uretirdi — Hollanda + Turkiye ikilisinin "orta noktasi" Balkanlar'da bir tarladir.
    Cikis yolu CAPADIR: host sabit bir bulusma yeri secerse kural HIC islemez ve ayni konum
    kabul edilir. Konum GUNCELLEMEDE kisi kendi eski konumuyla kiyaslanmaz.
