info:
  name: Update Location
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/sessions/{{slug}}/location"
  headers:
    - name: content-type
      value: application/json
    - name: X-Participant-Token
      value: "{{participantToken}}"
  body:
    type: json
    data: |-
      {
        "lat": 51.5719,
        "lng": 5.0672,
        "label": "Someren",
        "travelMode": "BIKE"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("204 doner", function() {
          expect(res.status).to.equal(204);
        });

docs:
  type: text/markdown
  content: |-
    Katilimci token'i gerekir. Konumsuz katilan birinin deste akisina girmesinin yoludur.

    Katilimci token'i FAIL-CLOSED dogrulanir: yalnizca `/api/sessions/{slug}/...`
    yollarinda gecerlidir ve token'in ait oldugu oturum ile URL'deki slug eslesmeli.
    Baska oturumun slug'i ile denerseniz 401 alirsiniz.

    `travelMode` null gonderilirse mevcut tercih KORUNUR; konum guncellemesi modu silmez.

    **409 `participants_too_far_apart`** — capasiz oturumda gonderilen konum, gruptaki mevcut
    konumlardan birine 100 km'den uzaksa reddedilir (`SpreadLimit.MAX_SPREAD_KM`). Orta nokta
    katilimci konumlarindan turedigi icin cok dagilmis bir grupta anlamsiz bir merkez
    uretirdi — Hollanda + Turkiye ikilisinin "orta noktasi" Balkanlar'da bir tarladir.
    Cikis yolu CAPADIR: host sabit bir bulusma yeri secerse kural HIC islemez ve ayni konum
    kabul edilir. Konum GUNCELLEMEDE kisi kendi eski konumuyla kiyaslanmaz.
