info:
  name: My Request
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/sessions/{{slug}}/seat-requests/mine"
  headers:
    - name: X-Client
      value: mobile

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 ve durum", function() {
          expect(res.status).to.equal(200);
        });
        test("onaylandiysa mobilde katilimci jetonu gelir", function() {
          if (res.body.status === "APPROVED") {
            expect(res.body.participantToken).to.be.a("string");
            bru.setVar("participantToken", res.body.participantToken);
          }
        });

docs:
  type: text/markdown
  content: |-
    Isteyenin KENDI durumu (host olmak gerekmez; baskasininkini dondurmez).

    `APPROVED` ise katilimci token'i AYNI teslim kuralindan gecer:
    **web'de HttpOnly cookie** (`bumpinto_pt_{slug}`), **mobilde govde**. Ikinci bir kanal
    acilmaz — `ParticipantTokenDelivery` tek yerdir. Web'de `participantToken` alani null.
