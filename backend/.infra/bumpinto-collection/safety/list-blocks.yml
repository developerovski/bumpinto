info:
  name: List Blocks
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/me/blocks"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 doner", function() {
          expect(res.status).to.equal(200);
        });
        test("dizi doner", function() {
          expect(res.body).to.be.an("array");
        });

docs:
  type: text/markdown
  content: |-
    Hesabin engel listesi, en yeni once (`createdAt` azalan). Zarfsiz `BlockDto[]`.
    Iki tur satir gelir:
    - **Hesap engeli**: `userId` dolu, kalicidir.
    - **Anonim koltuk engeli**: `participantId` dolu, YALNIZ o oturum boyunca yasar
      (anonim koltugun kalici kimligi yoktur; kalici engel yanlis kisiyi susturur).

    `displayName` (nullable, K-W16): engellenenin OKUMA ANINDAKI adi — hesap engelinde
    `users.name`, koltuk engelinde `participants.display_name`. Ad engelde saklanmaz; kisi
    adini degistirirse liste yeni adi gosterir. Silinmis hesap, anonimlesmis koltuk ya da
    bos ad → `null` ("Silindi"/"Ayrildi" yer tutuculari ad olarak donmez); istemci
    "adi gorunmeyen kisi" basar. Kaldirma: `remove-block.yml`.
